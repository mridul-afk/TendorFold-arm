name: TensorFold CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install TensorFold
        run: |
          pip install -e .

      - name: Verify TensorFold import
        run: |
          python -c "import tensorfold; print('TensorFold imported successfully')"

      - name: Run TensorFold tests
        run: |
          pytest tests -v

      - name: Run basic TensorFold example
        run: |
          python examples/basic_tensorfold.py
